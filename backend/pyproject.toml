[project]
name = "hello-world-backend"
version = "0.1.0"
description = "Hello World AI 视频平台后端（比赛演示版/MVP）——有状态的 AI 编排与权限控制系统"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=43.0.0",
    "email-validator>=2.2.0",
    "aiosmtplib>=2.4.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "fakeredis>=2.24.0",
    "lupa>=2.0.0",
]

[tool.uv]
# 项目依赖锁定到 uv.lock；开发依赖使用 dependency-groups.dev
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# E501: 行长；RUF001/002/003: 中文字符串/docstring/注释中的全角标点等歧义字符（本项目大量中文，属正常）
# UP042: 枚举继承 str+Enum 的兼容写法（与旧项目保持一致），暂不强制改 StrEnum
# B008: FastAPI 的 Depends() 作为参数默认值是官方惯用法，非 bug
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic 环境文件需先注入 sys.path 才能导入 app，属既定模式
"alembic/env.py" = ["E402"]
# Alembic 迁移文件由 autogenerate 生成，尾随空格属模板特征
"alembic/versions/*" = ["W291"]

[tool.mypy]
python_version = "3.12"
# 注：当前 sqlmodel 0.0.42 未随包提供 mypy 插件（sqlmodel.mypy 已移除），因此不配置 plugins
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
